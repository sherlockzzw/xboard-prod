upstream xboard_app {
    server web:7001;
    keepalive 64;   # ✅ 新增：连接复用，Octane 必须
}

# ===============================
# HTTP 80
# ===============================
server {
    listen 80;
    server_name baiyangweb.lifewikipedia.com;

    location / {
        proxy_pass http://xboard_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ===============================
# HTTPS 443
# ===============================
server {
    listen 443 ssl http2;
    server_name baiyangweb.lifewikipedia.com;

    ssl_certificate     /etc/nginx/certs/baiyangweb.lifewikipedia.com.crt;
    ssl_certificate_key /etc/nginx/certs/baiyangweb.lifewikipedia.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =================================================
    # ✅ 登录接口 —— 单独优化（重点）
    # =================================================
    location = /api/v1/passport/auth/login {
        proxy_pass http://xboard_app;
        proxy_http_version 1.1;

        # ❗关键：禁止 upgrade，保持纯 HTTP
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        add_header Cache-Control "no-store";
    }

    # =================================================
    # 主应用代理（保持你原样）
    # =================================================
    location / {
        proxy_pass http://xboard_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # WebSocket 兼容
        proxy_set_header Origin '';
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
    }

    # ===============================
    # 管理页面 / 静态 / 其他（原样）
    # ===============================
    location = /Y6sBHbEVmk3srphzl1GCtbtN3nvyexBZoEGJ9elgrtIH {
        alias /www/public/code/admin-ip-whitelist.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location = /qF8mXpZ2rVtY7cN9eBwJ3kL6aQdS1gH5uI0oP4xTz {
        alias /www/public/code/version.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
    }
    location = /qF8mXpZ2rVtY7cN9eBwJ3kL6aQdS1gH5uI0oP4xTzLog {
        alias /www/public/code/admin-request-logs.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
    }
    location /web/ {
        alias /test/xboard/storage/web/v2board-theme-buddy-main/;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location ^~ /webtest {
        alias /test/web/v2board-theme-buddy-main/;
        index index.html;
        try_files $uri $uri/ /webtest/index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /img/ {
        alias /home/xboard/storage/img/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ===============================
# 内部 HTTP 8080
# ===============================
server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://xboard_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
